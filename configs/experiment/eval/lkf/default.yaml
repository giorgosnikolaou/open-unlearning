# @package _global_
# LKF (Lesser Known Facts) Evaluation Experiment

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /eval:
    - lkf

model:
  model_args:
    pretrained_model_name_or_path: ???  # Set to your unlearned model path

eval:
  lkf:
    batch_size: 8
    eval_cfg:
      output:
        task_name: ${task_name}

task_name: ???  # e.g., "lkf_eval_run1"