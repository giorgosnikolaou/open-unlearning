# @package _global_
# RWKU unlearning with DPO (Direct Preference Optimization).
# Uses paired data: positive (counterfactual) vs negative (factual) responses.

defaults:
  - override /model: Llama-3-8B-Instruct
  - override /trainer: DPO
  - override /data: unlearn
  - override /data/datasets@data.forget: RWKU_train_pair
  - override /data/datasets@data.retain: RWKU_train_positive
  - override /eval: rwku

model_family: llama3

# Set A — celebrities to forget
forget_subjects:
  - "Beyoncé"
  - "Blake Lively"
  - "Bruce Springsteen"
  - "Catherine, Princess of Wales"
  - "Daniel Day-Lewis"
  - "Donald Trump"
  - "Dr. Dre"
  - "Elon Musk"
  - "Jennifer Lopez"
  - "Jeff Goldblum"

# Set B — celebrities to retain (MIA holdout reference)
retain_subjects:
  - "Evel Knievel"
  - "Franklin D. Roosevelt"
  - "Grace Kelly"
  - "Halle Berry"
  - "Henry Winkler"
  - "Ice Cube"
  - "James Earl Jones"
  - "Jeff Bridges"
  - "Jay-Z"
  - "Jimmy Carter"

model:
  model_args:
    pretrained_model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct

data:
  anchor: forget
  forget:
    RWKU_train_pair:
      args:
        hf_args:
          name: "train_pair_${model_family}"
          filter_column: "subject"
          filter_values: ${forget_subjects}
  retain:
    RWKU_train_positive:
      args:
        hf_args:
          name: "train_positive_${model_family}"
          filter_column: "subject"
          filter_values: ${retain_subjects}

eval:
  rwku:
    overwrite: true
    forget_subjects: ${forget_subjects}
    retain_subjects: ${retain_subjects}

trainer:
  args:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 5e-6
    num_train_epochs: 3
    lr_scheduler_type: constant
  method_args:
    beta: 0.1

task_name: ???
