# @package _global_
# RWKU unlearning experiment using Phi-3 specific positive data.
# Uses train_positive_phi3 HF subset instead of train_positive_llama3.

defaults:
  - override /model: Phi-3-mini-4k-instruct
  - override /trainer: GradDiff
  - override /data: unlearn
  - override /data/datasets@data.forget: RWKU_train_positive_phi3
  - override /data/datasets@data.retain: RWKU_train_positive_phi3
  - override /eval: rwku

model_family: phi3

# Set A — celebrities to forget
forget_subjects:
  - "Beyoncé"
  - "Blake Lively"
  - "Bruce Springsteen"
  - "Catherine, Princess of Wales"
  - "Daniel Day-Lewis"
  - "Donald Trump"
  - "Dr. Dre"
  - "Elon Musk"
  - "Jennifer Lopez"
  - "Jeff Goldblum"

# Set B — celebrities to retain (MIA holdout reference)
retain_subjects:
  - "Evel Knievel"
  - "Franklin D. Roosevelt"
  - "Grace Kelly"
  - "Halle Berry"
  - "Henry Winkler"
  - "Ice Cube"
  - "James Earl Jones"
  - "Jeff Bridges"
  - "Jay-Z"
  - "Jimmy Carter"

model:
  model_args:
    pretrained_model_name_or_path: microsoft/Phi-3-mini-4k-instruct

data:
  anchor: forget
  forget:
    RWKU_train_positive_phi3:
      args:
        hf_args:
          filter_column: "subject"
          filter_values: ${forget_subjects}
  retain:
    RWKU_train_positive_phi3:
      args:
        hf_args:
          filter_column: "subject"
          filter_values: ${retain_subjects}

eval:
  rwku:
    overwrite: true
    forget_subjects: ${forget_subjects}
    retain_subjects: ${retain_subjects}

trainer:
  args:
    learning_rate: 1e-6
    weight_decay: 0.01
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8
    num_train_epochs: 10
    lr_scheduler_type: cosine
    warmup_steps: 20

task_name: ???