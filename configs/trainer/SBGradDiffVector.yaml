defaults:
  - finetune

handler: SelfBalancingGradDiff

args:
  learning_rate: 1e-5
  num_train_epochs: 5

method_args:
  alpha: 1.0
  gamma: 1.0

  scorer:
    _target_: scorers.VectorScorer
    input_dimension: 2048
    score_offset: 1.0

  scorer_trainer:
    _target_: trainer.unlearn.Scorer.ScorerTrainerProjected
    _partial_: true
    proj_alpha: 0.0
    proj_epsilon: 0.01
    lambda_entropy: 1.0
    lambda_population: 1.0
    budget: 0.2
    lambda_l2: 0.01
    optim_cfg:
      _target_: trainer.unlearn.Scorer.ScorerOptimConfig
      lr: 5.0e-2
      weight_decay: 1.0e-4
      momentum: 0.9
      update_every_n_steps: 10
      grad_clip: 1.0
      loss_reduction: mean
