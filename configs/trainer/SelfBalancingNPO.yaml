defaults:
  - finetune

handler: SelfBalancingNPO

args: # HuggingFace TrainingArguments
  learning_rate: 1e-5
  num_train_epochs: 5

method_args:
  scorer_cfg:
    _target_: trainer.unlearn.sb.ScorerConfig
    input_dimension: 4096
    # input_dimension: 2048
    layers: 1
    scale_factor: 1.0
    use_sigmoid: true
    zero_init: true

  scorer_optim_cfg:
    _target_: trainer.unlearn.sb.ScorerOptimConfig
    lr: 1.0e-1
    weight_decay: 1.0e-4
    momentum: 0.9

    update_every_n_steps: 10
    grad_clip: 1.0
    loss_reduction: mean

  alpha: 1.0
  gamma: 1.0

  forget_loss:
    _target_: trainer.unlearn.sb.SequenceWiseDPO
    
    lose_loss_fn:
      _target_: trainer.unlearn.sb.SequenceWiseNLL
      use_softmax: True
      per_sequence_loss: True

    beta: 0.1
  
  retain_loss:
    _target_: trainer.unlearn.sb.SequenceWiseNLL
