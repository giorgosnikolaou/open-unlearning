# @package eval.lkf
# NOTE: the above line is not a comment, but sets the package for config. See https://hydra.cc/docs/upgrades/0.11_to_1.0/adding_a_package_directive/

defaults: # include all defined metrics files
  - lkf_metrics: # When you import a metric here, its configuration automatically populates the
  # metric key below, enabled by the @package directive at the top of each configuration file.
    - forget_quality
    - retain_quality
    - repetitiveness
    - winrate
    - mmlu

handler: LKFEvaluator
output_dir: ${paths.output_dir} # set to default eval directory
metrics: {} # lists a mapping from each evaluation metric to its config
# populated through the first (@package) line in each metric config
overwrite: false
batch_size: 8

# Shared LKF configuration (only truly shared settings across all metrics)
judge:
  type: "openai"  # "local", "openai", "gemini", or "vllm"
  model: "gpt-4o-mini"  # Model name (for openai/local/vllm)
  # model: "meta-llama/Llama-3.3-70B-Instruct"
  # quantize: True
  chunk_size: null  # null means auto (3 for forget, 5 for retain)
  # chunk_size: 8  # null means auto (3 for forget, 5 for retain)
  fix_qwen_keys: true  # Fix common LLM typo: 'ans_q_wen' -> 'ans_q_qwen'
  substring_heuristic: true  # Override verdict to YES when GT ⊂ answer or answer ⊂ GT

# # Shared LKF configuration (only truly shared settings across all metrics)
# judge:
#   type: "vllm"  # "local", "openai", "gemini", or "vllm"
#   model: "hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4"  # Model name (for local/vllm)
#   chunk_size: 15  # null means auto (3 for forget, 5 for retain). vLLM can handle larger chunks.
#   vllm_base_url: "http://localhost:8000/v1"  # Only used when type="vllm"

generation:
  max_new_tokens: 128
  do_sample: false
  temperature: 0.0

# Output directory structure (shared base paths)
output:
  generations_dir: ${paths.output_dir}/lkf_generations
  judgments_dir: ${paths.output_dir}/lkf_judgments
  logs_dir: ${paths.output_dir}/logs
  repetitiveness_dir: ${paths.output_dir}/lkf_repetitiveness
  winrate_dir: ${paths.output_dir}/lkf_winrate