# @package eval.rwku
defaults:
  - rwku_metrics:
    - forget_level1_ROUGE
    - forget_level2_ROUGE
    - forget_level3_ROUGE
    - neighbor_level1_ROUGE
    - neighbor_level2_ROUGE
    # - mia_loss
    # - mia_min_k
    # - mia_min_k_plus_plus
    # - mia_zlib
    - mia_raw_loss
    - fluency

handler: RWKUEvaluator

output_dir: ${paths.output_dir}
metrics: {}
overwrite: false
