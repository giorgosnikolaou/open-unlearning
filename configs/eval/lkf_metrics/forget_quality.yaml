# @package eval.lkf.metrics.forget_quality
defaults:
  - ../../data/datasets@datasets: LKF_forget

handler: forget_quality_lkf
gemini_api_key: null  # Set via GOOGLE_API_KEY environment variable
output_dir: ${paths.output_dir}/lkf_forget

# Dataset configuration (matches the dataset loaded via defaults)
dataset_name: "nmndeep/LKF-forget_eval_para"
dataset_split: train

# Task identifier
eval_task: forget

max_samples: 100
# max_samples: 2

# Inherit shared settings from parent
judge: ${eval.lkf.judge}
generation: ${eval.lkf.generation}
output_base: ${eval.lkf.output}