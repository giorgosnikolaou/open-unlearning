# @package eval.lkf.metrics.retain_quality
defaults:
  - ../../data/datasets@datasets: LKF_retain_eval

handler: retain_quality_lkf
gemini_api_key: null  # Set via GOOGLE_API_KEY environment variable
output_dir: ${paths.output_dir}/lkf_retain

# Dataset configuration (matches the dataset loaded via defaults)
dataset_name: "nmndeep/LKF-retain_eval_para"
dataset_split: train

# Task identifier
eval_task: retain

# Metric-specific settings
max_samples: 400  # Limit samples for faster evaluation (default: 400)
# max_samples: 100
# max_samples: 2

# Inherit shared settings from parent
judge: ${eval.lkf.judge}
generation: ${eval.lkf.generation}
output_base: ${eval.lkf.output}