# @package eval.lkf.metrics.repetitiveness
defaults:
  - ../../data/datasets@datasets: LKF_utility

handler: repetitiveness_lkf
batch_size: ${eval.lkf.batch_size}
num_samples: 100
output_dir: ${paths.output_dir}/lkf_repetitiveness

# Dataset configuration (matches the dataset loaded via defaults)
dataset_name: "jinzhuoran/RWKU"
dataset_split: test

# Task identifier
eval_task: repet

# Baseline model path (for automatic baseline evaluation)
# Pass via command line: +baseline_model_path=meta-llama/Llama-3.2-1B-Instruct
baseline_model_path: null

# Inherit shared settings from parent
generation: ${eval.lkf.generation}
output_base: ${eval.lkf.output}