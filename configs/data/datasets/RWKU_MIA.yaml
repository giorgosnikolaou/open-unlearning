RWKU_MIA_holdout:
  access_key: holdout
  handler: CompletionDataset
  args:
    hf_args:
      path: "jinzhuoran/RWKU"
      name: "mia_retain"
      split: "test"
    prefix_key: "prompt" # doesn't exist in dataset — defaults to ""
    text_key: "text"
    max_length: 2048

RWKU_MIA_forget:
  access_key: forget
  handler: CompletionDataset
  args:
    hf_args:
      path: "jinzhuoran/RWKU"
      name: "mia_forget"
      split: "test"
    prefix_key: "prompt" # doesn't exist in dataset — defaults to ""
    text_key: "text"
    max_length: 2048
