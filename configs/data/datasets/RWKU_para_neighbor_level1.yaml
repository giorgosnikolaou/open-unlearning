RWKU_para_neighbor_level1:
  handler: ParaphraseQADataset
  args:
    hf_args:
      path: "ngiorgos/RWKU"
      name: "qa_with_paraphrases"
      split: "neighbor_level1"
    question_key: "question"
    answer_key: "answer"
    paraphrases_key: "paraphrases"
